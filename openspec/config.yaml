schema: spec-driven

context: |
  Project: Drone Lending System (Drohnenverwaltung)
  Drones and accessories are loaned to student groups.
  Backend: C#, ASP.NET Core 10 Web API, EF Core, SQLite (backend/DroneInventory.Api)
  Frontend: Angular, TypeScript (frontend/drone-inventory-ui)
  API: REST/JSON
  Architecture:
  - The frontend communicates exclusively with the backend REST API.
  - The frontend never accesses the database directly.
  - Business logic and validation live in the backend.
  Domain concepts (Ubiquitous Language, no synonyms): Drone, StudentGroup, Loan, LoanItem
  - Drone: Id, Name, Description
  - StudentGroup: Id, Name
  - Loan: Id, DroneId, StudentGroupId, LoanDate, ReturnDate, Status (Active | Returned)
  - LoanItem: Id, LoanId, Type (Battery | Propeller), Quantity
  Domain rules:
  - A drone can only have one active loan.
  - Only available drones can be loaned.
  - Returning a loan makes the drone available again.
  - Accessory quantities are integers and must not be negative.
  - Returned loans are never deleted.
  - Batteries and propellers are tracked as quantities only.
  - Drone availability (Available | Loaned) is derived from the active loan, not stored.
  Out of scope: login/roles, individual battery inventory, reservations,
  damage management, return differences, statistics and exports.

rules:
  proposal:
    - Always state what is out of scope.
  specs:
    - Use SHALL for every requirement and Given/When/Then scenarios for acceptance criteria.
    - Reference the requirement ID (REQ-001 ... REQ-010) in the requirement.
    - Cover error cases as their own scenarios (duplicate loan, negative quantity, unknown drone or group).
    - Describe behavior, not implementation details.
    - Use the domain terms Drone, StudentGroup, Loan, LoanItem consistently.
  tasks:
    - Keep tasks small, independent and individually testable.
    - Group tasks by Backend and Frontend and add a "verify ..." note to each task.
    - A requirement is not a task; split it into several tasks.

operations:
  apply:
    guidance:
      - Implement only the selected task or GitHub issue, never other tasks.
      - Every Given/When/Then scenario needs a test; name tests after the REQ-ID.
      - Run dotnet test / ng test before ticking off a task.
  archive:
    guidance:
      - Archive only after implementation, tests and merge.
